<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        rel="icon"
        type="image/jpeg"
        href="assets/club-logo.jpg"
    >

    <title>КИМ МФТИ - тренировки</title>

    <link rel="stylesheet" href="assets/style.css">

    <script
        src="https://accounts.google.com/gsi/client"
        async
    ></script>

    <script defer src="assets/config.js"></script>
    <script defer src="assets/api.js"></script>
    <script defer src="assets/admin.js"></script>
</head>

<body>
    <main class="page-shell">
        <header class="site-header">
            <div class="header-brand">
                <img
                    class="club-logo"
                    src="assets/club-logo.jpg"
                    alt="КИМ МФТИ"
                >

                <div class="header-brand-text">
                    <p class="eyebrow">
                        Фехтовальное направление
                    </p>

                    <h1>КИМ МФТИ</h1>

                    <p class="header-text">
                        Запись на странице конкретной тренировки.
                    </p>
                </div>
            </div>

            <button
                id="create-training-button"
                class="button button-primary"
                type="button"
            >
                Создать тренировку (админ)
            </button>
        </header>

        <p
            id="admin-state"
            class="status-text"
            aria-live="polite"
        ></p>

        <section class="section">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Запись на тренировки</p>
                </div>
            </div>

            <div
                id="training-list"
                class="training-list"
                aria-live="polite"
            >
                <div class="loading-state">
                    <span
                        class="spinner"
                        aria-hidden="true"
                    ></span>

                    <p class="status-text">
                        Загружаем анонсы…
                    </p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>ф
