<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Клуб исторического фехтования МФТИ — тренировки</title>
    <meta name="description" content="Расписание и запись на тренировки клуба исторического фехтования МФТИ.">

    <link rel="preconnect" href="https://sheets.googleapis.com" crossorigin>

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">

    <!-- Нужен только для входа админа; на чтение расписания не влияет. -->
    <script src="https://accounts.google.com/gsi/client" async></script>

    <script type="module" src="src/pages/home.js"></script>
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <div class="header-brand">
                <img class="club-logo" src="assets/club-logo.jpg" alt="Эмблема клуба" width="76" height="76">

                <div class="header-brand-text">
                    <p class="eyebrow">Фехтовальное Направление</p>
                    <h1>КИМ МФТИ</h1>
                    <p class="header-text">Запись на тренировки</p>
                </div>
            </div>

            <div>
                <button id="create-training-button" class="button button-secondary" type="button">
                    Создать тренировку
                </button>

                <p id="admin-state" class="status-text hidden"></p>
            </div>
        </header>

        <main>
            <section class="section">
                <div class="section-heading">
                    <h2>Ближайшие тренировки</h2>
                </div>

                <div id="training-list" class="training-list">
                    <div class="loading-state">
                        <span class="spinner spinner-large"></span>
                        <p class="status-text">Загружаем расписание…</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
