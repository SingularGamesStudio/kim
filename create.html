<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новая тренировка — КИМ МФТИ</title>
    <meta name="robots" content="noindex">

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/pages.css">

    <script type="module" src="src/pages/create.js"></script>
</head>
<body>
    <div class="page-shell">
        <a class="back-link" href="index.html">← Все тренировки</a>

        <header class="site-header compact-header">
            <div>
                <p class="eyebrow">Только для организаторов</p>
                <h1>Новая тренировка</h1>
                <p id="auth-state" class="status-text">Проверяем доступ…</p>
            </div>
        </header>

        <main>
            <form id="training-form" class="editor-form hidden">
                <section class="form-section">
                    <div class="section-heading">
                        <h2>Когда и что</h2>
                    </div>

                    <div class="form-grid">
                        <label>
                            Дата
                            <input id="date" type="date" required>
                        </label>

                        <label>
                            Время начала
                            <input id="time" type="time" value="20:00" required>
                        </label>

                        <label>
                            Кворум
                            <input id="quorum" type="number" min="0" max="99" value="4" required>
                        </label>
                    </div>

                    <div id="type-grid" class="checkbox-grid"></div>

                    <p class="hint">
                        Если выбрать больше одного вида, на странице тренировки
                        появится голосование.
                    </p>
                </section>

                <section class="form-section">
                    <div class="section-heading">
                        <h2>Где</h2>
                    </div>

                    <div class="form-grid">
                        <label>
                            Сбор и деплой
                            <select id="deployment-preset"></select>
                        </label>

                        <label>
                            Место тренировки
                            <select id="venue-preset"></select>
                        </label>
                    </div>

                    <div class="form-grid">
                        <label id="deployment-custom-wrap" class="hidden">
                            Название точки сбора
                            <input id="deployment-custom" type="text" maxlength="60">
                        </label>

                        <label id="venue-custom-wrap" class="hidden">
                            Название места тренировки
                            <input id="venue-custom" type="text" maxlength="60">
                        </label>
                    </div>

                    <div id="map" class="map-editor"></div>

                    <p class="map-help">
                        Перетащите крестики: зелёный — сбор и деплой,
                        красный — место тренировки.
                    </p>
                </section>

                <section class="form-section">
                    <div class="section-heading">
                        <h2>Комментарий к анонсу</h2>
                    </div>

                    <label>
                        Текст (необязательно)
                        <textarea id="comment" maxlength="500"></textarea>
                    </label>

                    <div class="form-action-row form-action-row-spaced">
                        <button class="button button-primary" type="submit">
                            Создать тренировку
                        </button>
                    </div>
                </section>
            </form>

            <div id="result" class="creation-result hidden"></div>
        </main>
    </div>
</body>
</html>
