<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Тренировка</title>

    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="vendor/ol.css">

    <script defer src="assets/config.js"></script>
    <script defer src="assets/api.js"></script>
    <script defer src="vendor/ol.js"></script>
    <script defer src="assets/training.js"></script>
</head>

<body>
    <main class="page-shell">
        <aside id="safety" class="safety-banner">
            <span>
                Перед тренировкой прочитайте
                <a
                    target="_blank"
                    rel="noopener"
                    href="https://m.vk.ru/@kimmipt-kratkaya-instrukciya-po-tehnike-bezopasnosti-dlya-zanyatii-p"
                >
                    краткую инструкцию по технике безопасности
                </a>.
            </span>

            <button
                id="hide-safety"
                type="button"
                aria-label="Закрыть"
            >
                ×
            </button>
        </aside>

        <a class="back-link" href="index.html">
            ← Все тренировки
        </a>

        <section id="training" class="training-hero">
            <p class="status-text">Загружаем тренировку…</p>
        </section>

        <div id="map" class="training-map hidden"></div>

        <section
            id="signup-section"
            class="content-section hidden"
        >
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Участники</p>
                    <h2>Записаться</h2>
                </div>
            </div>

            <form id="signup-form" class="signup-form">
                <label>
                    Представьтесь
                    <input
                        id="name"
                        maxlength="80"
                        autocomplete="name"
                        required
                    >
                </label>

                <label>
                    Комментарий
                    <textarea
                        id="signup-comment"
                        maxlength="500"
                        placeholder="+"
                    ></textarea>
                </label>

                <div id="vote-options"></div>

                <label class="honeypot">
                    Не заполняйте
                    <input
                        id="website"
                        tabindex="-1"
                        autocomplete="off"
                    >
                </label>

                <div class="form-action-row">
                    <button
                        class="button button-primary"
                        type="submit"
                    >
                        Записаться
                    </button>

                    <p
                        id="signup-message"
                        class="status-text"
                        aria-live="polite"
                    ></p>
                </div>
            </form>
        </section>

        <section
            id="entries-section"
            class="content-section hidden"
        >
            <div class="section-heading entries-heading">
                <div>
                    <p class="eyebrow">Текущий состав</p>
                    <h2>
                        Записи
                        <span id="participant-count"></span>
                    </h2>
                </div>

                <div
                    id="vote-results"
                    class="vote-results"
                ></div>
            </div>

            <div id="entries" class="entries"></div>
        </section>
    </main>
</body>
</html>
